name: Render and publish a prepared reel

# For a reel whose script was written into content/<day>/reels.json by hand
# rather than by the daily run - an extra story, a re-cut. It renders here,
# where the Gemini key for the narration lives (python -m headlinne
# render-reel), commits the MP4, and then publishes it through Buffer exactly
# like the scheduled slots do. Started by hand from the Actions tab.
on:
  workflow_dispatch:
    inputs:
      slot:
        description: "Which reel slot holds the script"
        required: true
        type: choice
        default: reel-2
        options:
          - reel-2
          - reel-1
      day:
        description: "Content day, YYYY-MM-DD in IST (empty means today)"
        required: false
        default: ""
      publish:
        description: "Publish to Instagram once rendered"
        required: true
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: headlinne-publish-${{ inputs.slot }}
  cancel-in-progress: false

jobs:
  reel:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # Inputs reach the shell through the environment, never by template
      # substitution into a command line.
      SLOT: ${{ inputs.slot }}
      DAY_INPUT: ${{ inputs.day }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Render the reel
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          REEL_STYLE: ${{ vars.REEL_STYLE }}
          REEL_VOICEOVER: ${{ vars.REEL_VOICEOVER }}
          REEL_TTS_MODEL: ${{ vars.REEL_TTS_MODEL }}
          REEL_VOICE_NEWS: ${{ vars.REEL_VOICE_NEWS }}
          REEL_VOICE_EDUCATION: ${{ vars.REEL_VOICE_EDUCATION }}
        run: |
          set -- --slot "$SLOT"
          if [ -n "$DAY_INPUT" ]; then set -- "$@" --day "$DAY_INPUT"; fi
          python -m headlinne render-reel "$@"

      - name: Commit the rendered reel
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
          else
            git commit -m "Render $SLOT $(date -u +%Y-%m-%dT%H:%M)"
            git pull --rebase --autostash
            git push
          fi

      # Buffer fetches the video from the public URL of the commit just pushed,
      # so do not hand it over until that URL actually serves the file.
      - name: Wait for the video to be served
        if: inputs.publish
        env:
          PUBLIC_IMAGE_BASE_URL: ${{ vars.PUBLIC_IMAGE_BASE_URL }}
        run: |
          python - <<'EOF'
          import os, time
          from datetime import date
          import requests
          from headlinne import storage
          from headlinne.publish import get_image_host
          from headlinne.scheduling import today_ist
          raw = os.environ.get("DAY_INPUT", "").strip()
          day = date.fromisoformat(raw) if raw else today_ist()
          slot = os.environ["SLOT"].replace("-", "_")
          url = get_image_host().url_for(storage.reel_video_path(day, slot))
          for attempt in range(24):
              try:
                  if requests.head(url, timeout=10, allow_redirects=True).status_code == 200:
                      print("served:", url)
                      break
              except requests.RequestException:
                  pass
              time.sleep(5)
          else:
              raise SystemExit(f"video never became available at {url}")
          EOF

      - name: Publish
        if: inputs.publish
        env:
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
          BUFFER_CHANNEL_ID_INSTAGRAM: ${{ secrets.BUFFER_CHANNEL_ID_INSTAGRAM }}
          BUFFER_SCHEDULING_MODE: ${{ vars.BUFFER_SCHEDULING_MODE }}
          PUBLIC_IMAGE_BASE_URL: ${{ vars.PUBLIC_IMAGE_BASE_URL }}
        run: |
          set -- --target "$SLOT"
          if [ -n "$DAY_INPUT" ]; then set -- "$@" --day "$DAY_INPUT"; fi
          python -m headlinne publish "$@"

      - name: Record publish marker
        if: always() && inputs.publish
        run: |
          git add content/ || true
          if git diff --cached --quiet; then
            echo "No marker changes to commit."
          else
            git pull --rebase --autostash || true
            git commit -m "Publish marker $SLOT $(date -u +%Y-%m-%dT%H:%M)" || true
            git push || true
          fi
