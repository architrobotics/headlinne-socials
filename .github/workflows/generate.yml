name: Generate daily content

# Triggered once a day by cron-job.org via the workflow_dispatch REST API.
# cron-job.org only fires this trigger (it returns instantly, well within its
# 30 second limit). All the heavy work runs here on GitHub's runners.
#
# A schedule is included as a backup in case the external trigger ever misses.
# Times are UTC. 00:30 UTC = 06:00 IST. Remove it if you only want cron-job.org.
on:
  workflow_dispatch:
  

permissions:
  contents: write          # needed to commit the generated content back

concurrency:
  group: headlinne-generate
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    # Rendering two reels adds a few minutes of video encoding to the run. This
    # ceiling is well clear of a normal day and stops a hung job from running on.
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # The runner image already ships ffmpeg, and imageio-ffmpeg in
      # requirements.txt is the fallback if that ever changes. This step just
      # records which one will be used, because "no reels today" is otherwise a
      # confusing thing to debug from the logs alone.
      - name: Check the video encoder
        run: |
          python -c "from headlinne.render.motion import ffmpeg_binary; print('ffmpeg:', ffmpeg_binary())"

      - name: Generate content
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
          BUFFER_CHANNEL_ID_X: ${{ secrets.BUFFER_CHANNEL_ID_X }}
          BUFFER_CHANNEL_ID_LINKEDIN: ${{ secrets.BUFFER_CHANNEL_ID_LINKEDIN }}
          BUFFER_CHANNEL_ID_INSTAGRAM: ${{ secrets.BUFFER_CHANNEL_ID_INSTAGRAM }}
          BUFFER_SCHEDULING_MODE: ${{ vars.BUFFER_SCHEDULING_MODE }}
          PUBLIC_IMAGE_BASE_URL: ${{ vars.PUBLIC_IMAGE_BASE_URL }}
          REELS_ENABLED: ${{ vars.REELS_ENABLED }}
          STORY_CARD_ENABLED: ${{ vars.STORY_CARD_ENABLED }}
          CAROUSEL_ENABLED: ${{ vars.CAROUSEL_ENABLED }}
          IG_SECOND_CAROUSEL: ${{ vars.IG_SECOND_CAROUSEL }}
          SECOND_REEL: ${{ vars.SECOND_REEL }}
          GEMINI_FALLBACK_MODELS: ${{ vars.GEMINI_FALLBACK_MODELS }}
          FEED_TIMEOUT_SECONDS: ${{ vars.FEED_TIMEOUT_SECONDS }}
          REEL_VOICEOVER: ${{ vars.REEL_VOICEOVER }}
          REEL_TTS_MODEL: ${{ vars.REEL_TTS_MODEL }}
          REEL_VOICE_NEWS: ${{ vars.REEL_VOICE_NEWS }}
          REEL_VOICE_EDUCATION: ${{ vars.REEL_VOICE_EDUCATION }}
        run: |
          python -m headlinne generate

      - name: Commit generated content
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/ state/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Daily content $(date -u +%Y-%m-%d)"
            git push
          fi
